    adafruit/DHT sensor library
    arduino-libraries/LiquidCrystal

; ---- Stage 2. IoT Foundation (advanced) -----------------------------------

; MPU6050/MPU6500 sensor diagnostic without Wi-Fi/MQTT — run before lesson 20.
; Reads registers directly over I2C (Wire), needs no external libraries.
[env:lesson_check_mpu]
build_src_filter = +<lessons-advance/lesson_check_mpu.cpp>

[env:lesson19_mqtt]
build_src_filter = +<lessons-advance/lesson19_mqtt_telemetry.cpp>
lib_deps =
    knolleary/PubSubClient
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

[env:lesson20_mpu6050]
build_src_filter = +<lessons-advance/lesson20_mpu6050.cpp>
lib_deps =
    knolleary/PubSubClient
    tockn/MPU6050_tockn

; ---- Stage 3. Robot ------------------------------------------------------

; TB6612FNG driver diagnostic without Wi-Fi/MQTT — run before lesson 21.
; Runs the motors through a test sequence to check the wiring and the
; direction of rotation. Only GPIO/analogWrite, needs no external libraries.
[env:lesson_check_tb6612]
build_src_filter = +<lessons-advance/lesson_check_tb6612.cpp>

; The simplest test: both motors go forward right away and never stop.
[env:lesson_check_tb6612_forward]
build_src_filter = +<lessons-advance/lesson_check_tb6612_forward.cpp>

; Lesson 21: motor control via TB6612FNG. The ESP32 subscribes to the
; commands/esp32/drive commands and turns two motors (forward/back/left/right/stop).
[env:lesson21_motors]
build_src_filter = +<lessons-advance/lesson21_tb6612_drive.cpp>
lib_deps =
    knolleary/PubSubClient

; Lesson 22: lessons 20 + 21 in one firmware. The ESP32 simultaneously publishes the
; tilt angle (sensors/esp32/pitch|roll|yaw + guard) and listens to commands/esp32/drive,
; so the MPU6050 and the TB6612FNG are connected AT THE SAME TIME — their pins in
; include/pins.h don't overlap. Needs both libraries from lessons 20 and 21.
[env:lesson22_robot_telemetry]
build_src_filter = +<lessons-advance/lesson22_robot_telemetry.cpp>
lib_deps =
    knolleary/PubSubClient
    tockn/MPU6050_tockn

; ---- Stage 6. Camera (ESP32-S3-CAM) ---------------------------------------
;
; WARNING: these lessons use a DIFFERENT BOARD AND A DIFFERENT CHIP. Everything above
; builds for the ESP32-WROOM-32 DevKit (board = esp32dev from the [env] section), while
; the camera lessons build for the HW-679 ESP32-S3-CAM (ESP32-S3-WROOM-1 N16R8). Shared
; settings are moved to the [cam_s3] section below; each camera env pulls it in via extends.
;
; Breakdown of the [cam_s3] settings:
;   board = esp32-s3-devkitc-1        generic S3 board; specifics below
;   memory_type = qio_opi             QIO flash + OPI PSRAM. THIS IS THE KEY ONE:
;                                     on N16R8/N8R8 the PSRAM is eight-line (octal).
;                                     For N8R2 modules (quad PSRAM) use qio_qspi,
;                                     otherwise the log will show "PSRAM not found".
;   partitions = default_16MB.csv     for 16 MB of flash (the camera firmware is ~1 MB,
;                                     it wouldn't fit the default 4 MB layout)
;   -DBOARD_HAS_PSRAM                 enables external PSRAM in the core
;   -DARDUINO_USB_MODE=1              the S3's USB-C is NATIVE (no CH340/CP2102)
;   -DARDUINO_USB_CDC_ON_BOOT=1       Serial goes to this same USB, the monitor works
;                                     over the same cable as flashing
;
; IF THE MONITOR IS EMPTY: the board does have a UART bridge after all. To check —
; `pio device list`: VID/PID 303A:1001 = native Espressif USB (leave as
; is), 1A86:7523 = CH340, 10C4:EA60 = CP2102 — then set
; -DARDUINO_USB_CDC_ON_BOOT=0 and Serial goes back to UART0.
;
; The camera library (esp_camera.h) is part of the arduino-esp32 core — no lib_deps needed.
; Flashing: the S3 has native USB, NO GPIO0 jumper needed. If upload doesn't start —
; hold BOOT, briefly press RST, release BOOT.
; Details — src/lessons-advance/documentation/esp32cam_hardware.md

[cam_s3]
; MIND the build log: PlatformIO prints the board name from the stock JSON —
; «ESP32-S3-DevKitC-1-N8 (8 MB QD, No PSRAM)». That is a TEXT label (the "name" field),
; not an effective setting, and it can't be overridden from an env. The real values
; are set by the lines below, and they already match the N16R8: the next log line is
; «HARDWARE: ESP32S3 240MHz, 320KB RAM, 16MB Flash», and esptool gets --flash_size 16MB.
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; The CH340 bridge on this board falls apart at the board definition's 460800: esptool
; fails with «Serial data stream stopped». 115200 is slower, but gets through.
upload_speed = 115200
; The board's stock JSON has hwids = native Espressif USB only (303A:1001), but here it's
; a CH340 bridge (1A86:7523) — the port isn't recognised by hwids, and PlatformIO picks it
; by its fallback "take whatever is available" logic. We pin it explicitly so that with
; several COM ports it doesn't go to the wrong one. If the connector changes — fix the number.
upload_port = COM5
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0   ; this board has a CH340 bridge (1A86:7523), Serial -> UART0

; Camera diagnostic without Wi-Fi — run it FIRST. Captures frames to Serial,
; prints the PSRAM size and can hunt for the flash LED pin ("LED hunt").
[env:lesson_check_cam]
extends = cam_s3
build_src_filter = +<lessons-advance/lesson_check_cam.cpp>

; The same diagnostic, but for the CLASSIC ESP32-CAM (AI-Thinker) — that is a plain
; ESP32, not an S3, so extends = cam_s3 doesn't fit here: different chip, 4 MB of
; flash, external PSRAM. board = esp32cam already carries -DBOARD_HAS_PSRAM and
; huge_app.csv, so it's enough to select the camera pins with a flag (see include/pins.h).
; The lesson_check_cam.cpp sketch itself is portable — nothing S3-specific in it.
; Why: to tell a live sensor from a dead one when the ribbon is moved to another board.
[env:lesson_check_cam_aithinker]
board = esp32cam
build_src_filter = +<lessons-advance/lesson_check_cam.cpp>
build_flags = -DCAM_MODEL_AI_THINKER
; CH340 bridge, same speed story as with the S3 board.
upload_speed = 115200

; Lesson 23: a single frame over HTTP (/jpg) — "a camera in the browser".
[env:lesson23_cam_snapshot]
extends = cam_s3
build_src_filter = +<lessons-advance/lesson23_cam_snapshot.cpp>

; Lesson 24: MJPEG video stream. Page on :80, stream on :81/stream.
[env:lesson24_cam_stream]
extends = cam_s3
build_src_filter = +<lessons-advance/lesson24_cam_stream.cpp>

; Lesson 25: a panel with all the OV2640 sensor settings on top of the stream.
[env:lesson25_cam_controls]
extends = cam_s3
build_src_filter = +<lessons-advance/lesson25_cam_controls.cpp>

; Lesson 26: FPV car. The camera serves video and republishes button presses
; to commands/esp32/drive, which the lesson-22 robot (on the DevKit) listens to.
; Needs PubSubClient — the camera is a full MQTT client here.
[env:lesson26_fpv_robot]
extends = cam_s3
build_src_filter = +<lessons-advance/lesson26_fpv_robot.cpp>
lib_deps =
    knolleary/PubSubClient

; Lesson 27: HC-SR04 — ultrasonic rangefinder. Plain DevKit (esp32dev), no
; extends: the camera has nothing to do with it. No network, no libraries — only pulseIn
; and physics. WARNING: the sensor's ECHO is 5-volt, it goes to GPIO39 through a
; 1k/2k divider (see include/pins.h and documentation/lesson27_hcsr04.md).
[env:lesson27_hcsr04]
build_src_filter = +<lessons-advance/lesson27_hcsr04.cpp>

; Lesson 28: scanning sonar — an SG90 turns the HC-SR04 and we get a sector, not
; a single number. Same DevKit, still no libraries: the servo is LEDC at
; 50 Hz (ledcSetup + microsecond conversion), not the Servo library.
; SERVO POWER — from 5 V, not from the board's 3V3 (inrush current ~700 mA).
[env:lesson28_servo_sonar]
build_src_filter = +<lessons-advance/lesson28_servo_sonar.cpp>

; Lesson 29: autopilot v1 — lessons 22 + 28 in one firmware. The robot drives itself:
; "pings" along its heading, stops at a wall, sweeps the sonar across a sector and
; drives off towards the free angle. Same libraries as lesson 22 — the sonar and
; servo are still our own code, no Servo/NewPing.
; The autopilot is switched on from the browser with the auto command on commands/esp32/mode.
[env:lesson29_autopilot]
build_src_filter = +<lessons-advance/lesson29_autopilot.cpp>
lib_deps =
    knolleary/PubSubClient
    tockn/MPU6050_tockn

; Cytron MDD10A diagnostic without Wi-Fi/MQTT — run before lesson 30.
; Each motor forward/back separately, then both. Wheels off the table!
[env:lesson_check_mdd10]
build_src_filter = +<lessons-advance/lesson_check_mdd10.cpp>

; Lesson 30: the same autopilot as lesson 29, but the motors go through a Cytron MDD10A
; (DIR + PWM per channel, 20 kHz PWM) instead of the TB6612FNG. MQTT topics are unchanged:
; the backend, dashboard and FPV camera (lesson 26) work without edits.
[env:lesson30_autopilot_mdd10]
build_src_filter = +<lessons-advance/lesson30_autopilot_mdd10.cpp>
lib_deps =
    knolleary/PubSubClient
    tockn/MPU6050_tockn


[env:lesson_uart_gsm_manual_command]
build_src_filter = +<gsm-sim800l-lessons/lesson_uart_gsm_manual_command.cpp>
; for manually typing AT commands in the monitor (lesson 2)
monitor_echo = yes
monitor_eol = CRLF
monitor_filters = send_on_enter
lib_deps =
    vshymanskyy/TinyGSM
    knolleary/PubSubClient
[env:lesson_smsretrive_viauartwithoutsave]
build_src_filter = +<gsm-sim800l-lessons/lesson_smsretrive_viauartwithoutsave.cpp>

[env:lesson_relay_sms]
build_src_filter = +<gsm-sim800l-lessons/lesson_relay_sms.cpp>
