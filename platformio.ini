; PlatformIO Project Configuration File
;
; Each lesson is a self-contained sketch under src/lessons-basic/ with its own
; setup()/loop(). Only ONE lesson is compiled at a time, selected by the
; build_src_filter in its [env:...] block below.
;
;   pio run -e lesson07_toggle -t upload     # flash a specific lesson
;   pio run -e lesson05_melody               # build only
;   pio run                                  # builds default_envs (below)
;
; To add a lesson: drop src/lessons-basic/lessonNN_name.cpp, then add an
; [env:lessonNN_name] block pointing build_src_filter at that file.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lesson24_cam_stream

; Shared settings inherited by every lesson env.
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; На платах с мостом CH340 линии DTR/RTS заведены на цепь автосброса, и монитор,
; открывая порт, ДЕРЖИТ чип в reset: вывод пустой, а Wi-Fi-сервер недоступен.
; Эти две строки говорят монитору не трогать DTR/RTS — плата продолжает работать.
; (Прошивке они не мешают: upload дёргает сброс сам, отдельным механизмом.)
monitor_dtr = 0
monitor_rts = 0

[env:lesson02_traffic_light]
build_src_filter = +<lessons-basic/lesson02_traffic_light.cpp>

[env:lesson03_rgb]
build_src_filter = +<lessons-basic/lesson03_rgb.cpp>

[env:lesson04_buzzer]
build_src_filter = +<lessons-basic/lesson04_buzzer.cpp>

[env:lesson05_melody]
build_src_filter = +<lessons-basic/lesson05_melody.cpp>

[env:lesson06_button]
build_src_filter = +<lessons-basic/lesson06_button.cpp>

[env:lesson07_toggle]
build_src_filter = +<lessons-basic/lesson07_toggle.cpp>

[env:lesson08_sens_module]
build_src_filter = +<lessons-basic/lesson08_sens_module.cpp>

[env:lesson09_ir]
build_src_filter = +<lessons-basic/lesson09_ir.cpp>

[env:lesson10_pot_brightness]
build_src_filter = +<lessons-basic/lesson10_pot_brightness.cpp>

[env:lesson11_ldr_threshold]
build_src_filter = +<lessons-basic/lesson11_ldr_threshold.cpp>

[env:lesson12_dht11]
build_src_filter = +<lessons-basic/lesson12_dht11.cpp>
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

[env:lesson13_lcd]
build_src_filter = +<lessons-basic/lesson13_lcd.cpp>
lib_deps =
    arduino-libraries/LiquidCrystal

[env:lesson14_lcddh11]
build_src_filter = +<lessons-basic/lesson14_lcddh11.cpp>
lib_deps =
    adafruit/DHT sensor library
    arduino-libraries/LiquidCrystal

[env:lesson15_relay]
build_src_filter = +<lessons-basic/lesson15_relay.cpp>

[env:lesson16_WiFi]
build_src_filter = +<lessons-basic/lesson16_WiFi.cpp>

[env:lesson17_http_server]
build_src_filter = +<lessons-basic/lesson17_http_server.cpp>
lib_deps = adafruit/DHT sensor library

[env:lesson18_meteostation]
build_src_filter = +<lessons-basic/lesson18_meteostation.cpp>
lib_deps =
    adafruit/DHT sensor library
    arduino-libraries/LiquidCrystal

; ---- Этап 2. IoT Foundation (advanced) ------------------------------------

; Диагностика датчика MPU6050/MPU6500 без Wi-Fi/MQTT — прогнать перед уроком 20.
; Чтение регистров напрямую по I2C (Wire), внешних библиотек не требует.
[env:lesson_check_mpu]
build_src_filter = +<lessons-advance/lesson_check_mpu.cpp>

[env:lesson19_mqtt]
build_src_filter = +<lessons-advance/lesson19_mqtt_telemetry.cpp>
lib_deps =
    knolleary/PubSubClient
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

[env:lesson20_mpu6050]
build_src_filter = +<lessons-advance/lesson20_mpu6050.cpp>
lib_deps =
    knolleary/PubSubClient
    tockn/MPU6050_tockn

; ---- Этап 3. Робот -------------------------------------------------------

; Диагностика драйвера TB6612FNG без Wi-Fi/MQTT — прогнать перед уроком 21.
; Гоняет моторы по тестовой последовательности, чтобы проверить проводку и
; направление вращения. Только GPIO/analogWrite, внешних библиотек не требует.
[env:lesson_check_tb6612]
build_src_filter = +<lessons-advance/lesson_check_tb6612.cpp>

; Самый простой тест: оба мотора сразу вперёд и не останавливаются.
[env:lesson_check_tb6612_forward]
build_src_filter = +<lessons-advance/lesson_check_tb6612_forward.cpp>

; Урок 21: управление моторами через TB6612FNG. ESP32 подписывается на команды
; commands/esp32/drive и крутит два мотора (forward/back/left/right/stop).
[env:lesson21_motors]
build_src_filter = +<lessons-advance/lesson21_tb6612_drive.cpp>
lib_deps =
    knolleary/PubSubClient

; Урок 22: уроки 20 + 21 в одной прошивке. ESP32 одновременно публикует угол
; наклона (sensors/esp32/pitch|roll|yaw + guard) и слушает commands/esp32/drive,
; поэтому MPU6050 и TB6612FNG подключены ОДНОВРЕМЕННО — их пины в include/pins.h
; не пересекаются. Нужны обе библиотеки из уроков 20 и 21.
[env:lesson22_robot_telemetry]
build_src_filter = +<lessons-advance/lesson22_robot_telemetry.cpp>
lib_deps =
    knolleary/PubSubClient
    tockn/MPU6050_tockn

; ---- Этап 6. Камера (ESP32-S3-CAM) ----------------------------------------
;
; ВНИМАНИЕ: у этих уроков ДРУГАЯ ПЛАТА И ДРУГОЙ ЧИП. Всё выше собирается под
; ESP32-WROOM-32 DevKit (board = esp32dev из секции [env]), а камерные уроки —
; под HW-679 ESP32-S3-CAM (ESP32-S3-WROOM-1 N16R8). Общие настройки вынесены в
; секцию [cam_s3] ниже, каждый камерный env подключает её через extends.
;
; Разбор настроек [cam_s3]:
;   board = esp32-s3-devkitc-1        общий S3-борд; конкретика ниже
;   memory_type = qio_opi             QIO flash + OPI PSRAM. ЭТО КЛЮЧЕВОЕ:
;                                     у N16R8/N8R8 PSRAM восьмиканальная (octal).
;                                     Для модулей N8R2 (quad) нужно qio_qspi,
;                                     иначе в логе будет «PSRAM НЕ найдена».
;   partitions = default_16MB.csv     под 16 МБ флеша (прошивка с камерой ~1 МБ,
;                                     в дефолтную схему на 4 МБ она бы не влезла)
;   -DBOARD_HAS_PSRAM                 включает внешнюю PSRAM в ядре
;   -DARDUINO_USB_MODE=1              USB-C у S3 — НАТИВНЫЙ (без CH340/CP2102)
;   -DARDUINO_USB_CDC_ON_BOOT=1       Serial уходит в этот же USB, монитор работает
;                                     по тому же кабелю, что и прошивка
;
; ЕСЛИ МОНИТОР ПУСТОЙ: значит на плате всё-таки есть UART-мост. Проверить —
; `pio device list`: VID/PID 303A:1001 = нативный USB Espressif (оставить как
; есть), 1A86:7523 = CH340, 10C4:EA60 = CP2102 — тогда поставь
; -DARDUINO_USB_CDC_ON_BOOT=0 и Serial вернётся на UART0.
;
; Библиотека камеры (esp_camera.h) входит в ядро arduino-esp32 — lib_deps не нужен.
; Прошивка: у S3 нативный USB, перемычка GPIO0 НЕ нужна. Если upload не стартует —
; зажать BOOT, коротко нажать RST, отпустить BOOT.
; Подробности — src/lessons-advance/documentation/esp32cam_hardware.md

[cam_s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0   ; на этой плате мост CH340 (1A86:7523), Serial -> UART0

; Диагностика камеры без Wi-Fi — прогнать ПЕРВОЙ. Снимает кадры в Serial,
; печатает объём PSRAM и умеет искать пин подсветки («охота за LED»).
[env:lesson_check_cam]
extends = cam_s3
build_src_filter = +<lessons-advance/lesson_check_cam.cpp>

; Урок 23: один кадр по HTTP (/jpg) — «фотоаппарат в браузере».
[env:lesson23_cam_snapshot]
extends = cam_s3
build_src_filter = +<lessons-advance/lesson23_cam_snapshot.cpp>

; Урок 24: видеопоток MJPEG. Страница на :80, поток на :81/stream.
[env:lesson24_cam_stream]
extends = cam_s3
build_src_filter = +<lessons-advance/lesson24_cam_stream.cpp>

; Урок 25: панель со всеми настройками сенсора OV2640 поверх потока.
[env:lesson25_cam_controls]
extends = cam_s3
build_src_filter = +<lessons-advance/lesson25_cam_controls.cpp>

; Урок 26: FPV-машинка. Камера отдаёт видео и перепубликовывает нажатия кнопок
; в commands/esp32/drive, который слушает робот из урока 22 (на DevKit).
; Нужен PubSubClient — камера здесь полноценный MQTT-клиент.
[env:lesson26_fpv_robot]
extends = cam_s3
build_src_filter = +<lessons-advance/lesson26_fpv_robot.cpp>
lib_deps =
    knolleary/PubSubClient
